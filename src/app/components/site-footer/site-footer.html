<footer class="footer">
  <div class="container footer__inner">
    <div>
      <p class="footer__brand">{{ profile.name }}</p>
      <p class="footer__note">Built with Angular 21 — Standalone, Signals, SSR &amp; &#64;defer.</p>
    </div>
    <div class="footer__links">
      <a [href]="profile.resumeUrl" target="_blank" rel="noopener">Resume</a>
      <a [href]="profile.linkedinUrl" target="_blank" rel="noopener">LinkedIn</a>
      <a [href]="profile.githubUrl" target="_blank" rel="noopener">GitHub</a>
      <a [href]="'mailto:' + profile.email">Email</a>
      <a [href]="'tel:' + profile.phone">Call</a>
    </div>
    <p class="footer__copy">© {{ year }} {{ profile.name }}. Proof over claims.</p>
  </div>
</footer>
